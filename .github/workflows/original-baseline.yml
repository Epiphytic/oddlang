name: Native Linux original release baseline
on:
  push:
    branches: [verify/original-linux-amd64]
permissions:
  contents: read
jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      REVISION: af54339d250290490d62d4475a77539b7e739071
      TARGET: x86_64-unknown-linux-gnu
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare pinned native workspaces
        run: |
          set -euxo pipefail
          test "$(uname -m)" = x86_64
          test "$(id -u)" -ne 0
          mkdir "$RUNNER_TEMP/receipts"
          git init "$RUNNER_TEMP/reference"
          git -C "$RUNNER_TEMP/reference" fetch --depth=1 https://github.com/Epiphytic/marmish "$REVISION"
          git -C "$RUNNER_TEMP/reference" checkout --detach FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/reference" rev-parse HEAD)" = "$REVISION"
          rustup toolchain install 1.97.1 --profile minimal
          cd "$RUNNER_TEMP/reference"
          cargo +1.97.1 fetch --locked --target "$TARGET"
          cargo +1.97.1 fetch --locked --target "$TARGET" --manifest-path tools/installed-fixture/Cargo.toml
      - name: Build native release and observe original executable behavior
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/reference"
          export CARGO_TARGET_DIR="$RUNNER_TEMP/build"
          release="$CARGO_TARGET_DIR/$TARGET/release"
          receipts="$RUNNER_TEMP/receipts"
          cargo_release=(cargo +1.97.1 build --locked --offline --release --target "$TARGET")
          {
            git rev-parse HEAD 'HEAD^{tree}'
            sha256sum Cargo.lock tools/installed-fixture/Cargo.lock rust-toolchain.toml
            rustc +1.97.1 -vV
            cargo +1.97.1 -V
            lsb_release -ds
            uname -smr
            python3 -V
            cc --version | head -n 1
            id -u
            df -h "$RUNNER_TEMP"
            cargo +1.97.1 metadata --locked --offline --no-deps --format-version 1 | python3 -c '
          import json, sys
          packages = json.load(sys.stdin)["packages"]
          assert len(packages) == 7
          for pkg in packages:
              targets = [(t["name"], t.get("required-features", [])) for t in pkg["targets"]
                         if t["kind"] in (["bin"], ["example"])]
              print(pkg["name"], pkg["version"], targets)
          '
            set -x
            "${cargo_release[@]}" --workspace --bins
            "${cargo_release[@]}" -p marmish-mdk --example probe
            sha256sum "$release"/{marmish,marmishd,marmish-worker,marmish-release-tool,marmish-engine-bridge,marmish-engine-worker,examples/probe}
            test ! -e "$release/marmish-test-frontend"
            test ! -e "$release/marmish-installed-check"
            test ! -e "$release/marmish-installed-fixture"
            for binary in marmish marmishd; do
              "$release/$binary" --version >"$receipts/$binary-version.txt"
              "$release/$binary" --help >"$receipts/$binary-help.txt"
              grep -Eq '^marmish-native 0\.3\.1$' "$receipts/$binary-version.txt"
              test -s "$receipts/$binary-help.txt"
            done
            cargo +1.97.1 test --locked --offline --release --target "$TARGET" -p marmish-native --test process_limits
            for pass in 1 2; do
              python3 -B "$GITHUB_WORKSPACE/examples/marmish/portable-bridge/verify.py" \
                "$release/marmish-engine-bridge" "$release/marmish-engine-worker" \
                --report "$RUNNER_TEMP/bridge-$pass.json"
            done
            "${cargo_release[@]}" -p marmish-engine --features fault-injection --bin marmish-test-frontend
            "${cargo_release[@]}" -p marmish-native --features installed-checks \
              --bin marmish-installed-check --bin marmish-installed-fixture
            sha256sum "$release"/{marmish-test-frontend,marmish-installed-check,marmish-installed-fixture}
            (
              export CARGO_TARGET_DIR="$RUNNER_TEMP/standalone"
              "${cargo_release[@]}" --manifest-path tools/installed-fixture/Cargo.toml --bins
              sha256sum "$CARGO_TARGET_DIR/$TARGET/release/marmish-installed-fixture"
            )
            git diff --exit-code
          } 2>&1 | sed -E -e "s|$RUNNER_TEMP|\$RUNNER_TEMP|g" -e "s|$GITHUB_WORKSPACE|\$WORKSPACE|g" | tee "$receipts/build-and-test.txt"
          python3 - "$receipts" <<'PY'
          import json, pathlib, re, sys
          receipts = pathlib.Path(sys.argv[1])
          temp = receipts.parent
          reports = []
          for pass_number in (1, 2):
              raw = (temp / f"bridge-{pass_number}.json").read_text()
              replaced = raw.replace(str(temp), "$RUNNER_TEMP")
              sanitized = re.sub(r"/tmp/oddlang-bridge-[a-zA-Z0-9_]+", "$RUN", replaced)
              report = json.loads(sanitized)
              assert len(report["cases"]) == 5
              assert set(report["controls"].values()) == {"rejected"}
              (receipts / f"bridge-{pass_number}.json").write_text(sanitized)
              reports.append(report)
          if reports[0] != reports[1]:
              raise SystemExit("normalized bridge observations differ across two runs")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: original-linux-amd64-release
          path: ${{ runner.temp }}/receipts
          if-no-files-found: error
