[package]
name = "oddlang"
version = "0.1.0"
edition = "2024"
publish = false

[dev-dependencies]
apache-avro = { version = "=0.23.0", default-features = false }
arrow-array = "=60.2.0"
arrow-avro = { version = "=60.2.0", default-features = false }
postgres = "0.19"

[dependencies]
semver = "=1.0.28"
tempfile = "3.27.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11"
serde_json = "1"
oxigraph = { version = "0.5", default-features = false }
base64 = "=0.22.1"
wit-parser = "=0.252.0"
syn = { version = "=2.0.119", features = ["full", "visit", "extra-traits"] }
proc-macro2 = { version = "=1.0.107", features = ["span-locations"] }
toml = "=1.2.3"
ra_ap_parser = "=0.0.345"
ra_ap_syntax = "=0.0.345"
