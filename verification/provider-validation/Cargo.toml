[package]
name = "provider-validation"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
toml = "=1.2.3"
clap = { version = "4", features = ["derive"] }
rust-inventory = { path = "../rust-inventory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"

[[bin]]
name = "translation-proof"
path = "../rust-translation/scripts/runner.rs"

[[bin]]
name = "rust-capture"
path = "../rust-recovery/capture.rs"

[[bin]]
name = "translation-setup"
path = "../rust-translation/scripts/setup.rs"
