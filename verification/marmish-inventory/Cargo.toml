[package]
name = "marmish-inventory"
default-run = "marmish-inventory"
version = "0.1.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
flate2 = { version = "1", default-features = false, features = ["zlib"] }
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
toml = "=1.2.3"
tree-sitter = "=0.25.2"
tree-sitter-rust = "=0.24.0"
