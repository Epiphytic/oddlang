[package]
name = "record-provider-example"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["cdylib"]

[features]
recover = ["dep:syn"]

[dependencies]
base64 = "=0.22.1"
serde_json = "=1.0.151"
syn = { version = "=2.0.119", features = ["full"], optional = true }

[profile.release]
opt-level = "s"
lto = true
strip = true
panic = "abort"
