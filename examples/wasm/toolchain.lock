# Sourced by setup and verification from the repository root.
source examples/wasm/toolchain.toml
case "$(uname -sm)" in
    "Darwin arm64") platform=aarch64-macos; archive_sha256=$aarch64_macos ;;
    "Darwin x86_64") platform=x86_64-macos; archive_sha256=$x86_64_macos ;;
    "Linux aarch64") platform=aarch64-linux; archive_sha256=$aarch64_linux ;;
    "Linux x86_64") platform=x86_64-linux; archive_sha256=$x86_64_linux ;;
    *) echo "Unsupported wasm-tools host: $(uname -sm)" >&2; exit 1 ;;
esac
archive_name="wasm-tools-$wasm_tools_version-$platform"
cache="$PWD/target/wasm-tools"
